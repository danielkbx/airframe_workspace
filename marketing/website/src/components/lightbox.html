<dialog class="lightbox" aria-label="Screenshot viewer" data-lightbox>
  <div class="lightbox__bar">
    <p class="lightbox__count" aria-live="polite" data-lightbox-count></p>
    <div class="lightbox__actions">
      <a class="lightbox__full" href="#" target="_blank" rel="noopener" data-lightbox-full>Open full resolution</a>
      <button type="button" aria-label="Close image viewer" data-lightbox-close>Close</button>
    </div>
  </div>
  <div class="lightbox__stage">
    <button class="lightbox__arrow lightbox__arrow--previous" type="button" aria-label="Previous image" data-lightbox-previous>←</button>
    <img alt="" data-lightbox-image>
    <button class="lightbox__arrow lightbox__arrow--next" type="button" aria-label="Next image" data-lightbox-next>→</button>
  </div>
  <p class="lightbox__caption" data-lightbox-caption></p>
</dialog>
